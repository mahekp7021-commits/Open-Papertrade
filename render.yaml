services:
  - type: web
    name: open-papertrade-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: open-papertrade-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://open-papertrade-web.onrender.com

  - type: web
    name: open-papertrade-web
    runtime: node
    plan: free
    rootDir: frontend-ui
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: https://open-papertrade-api.onrender.com/api
      - key: BACKEND_URL
        value: https://open-papertrade-api.onrender.com
